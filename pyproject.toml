[project]
name = "monthly_attendance_import"
description = "Audited monthly attendance and overtime-hours import for Frappe HR"
authors = [{name = "MAAS"}]
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["openpyxl~=3.1.5"]

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"
